version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /graphy
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Major toolchain changes need coordinated compatibility work and review.
    # This does not suppress Dependabot security updates.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
