name: Validate Extension

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: graphy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile and lint
        run: npm run compile

      - name: Run extension tests
        run: npm test
